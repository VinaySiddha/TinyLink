services:
  # Backend API
  - type: web
    name: tinylink-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: tinylink-db
          property: connectionString
    healthCheckPath: /healthz

databases:
  - name: tinylink-db
    plan: free
    databaseName: tinylink
    user: tinylink
